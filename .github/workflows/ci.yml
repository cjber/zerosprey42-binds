name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Data and logic
        run: bun run check
      - name: Icons are present for every ability
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          missing = []
          for path in (root / "assets" / "classes").glob("*.json"):
              data = json.loads(path.read_text())
              for entry in data.get("abilities", []) + data.get("macros", []):
                  icon = entry.get("icon")
                  if icon and not (root / "assets" / "icons" / f"{icon}.jpg").exists():
                      missing.append(f"{path.name}: {entry.get('name')} -> {icon}")
          if missing:
              print("\n".join(missing))
              sys.exit(1)
          print("every ability and macro has its icon")
          PY
