# Cloudflare Workers with static assets: the bind planner is a plain static site.
name = "zerosprey42-binds"
compatibility_date = "2026-11-01"

# The custom domain is attached by tools/go-live.py in the account that owns cjber.dev. Leaving it
# out of this file keeps `wrangler deploy` from trying to create DNS records that already exist.
[assets]
directory = "./dist"
