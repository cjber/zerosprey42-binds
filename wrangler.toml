# Cloudflare Workers with static assets: the bind planner is a plain static site.
name = "zerosprey42-binds"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"

# A Worker only takes a custom domain whose zone is in the same account, so this lives with the
# account that owns cjber.dev. `custom_domain = true` makes wrangler create the DNS record too.
routes = [
  { pattern = "binds.cjber.dev", custom_domain = true }
]
